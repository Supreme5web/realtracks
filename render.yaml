services:
  - type: web
    name: pumpfun-alert-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Public RPC by default (free, but rate-limited and websocket can be
      # flaky). Override with a free-tier Helius/QuickNode/Shyft RPC+WS pair
      # if you see frequent reconnects or 429s in the logs.
      - key: SOLANA_WS_URL
        value: "wss://api.mainnet-beta.solana.com"
      - key: SOLANA_RPC_URL
        value: "https://api.mainnet-beta.solana.com"
      - key: MIN_MARKET_CAP_USD
        value: "12000"
      - key: POLL_INTERVAL_SECONDS
        value: "5"
      - key: MAX_TRACK_AGE_SECONDS
        value: "1800"
      - key: RPC_MIN_INTERVAL_SECONDS
        value: "0.25"
      - key: DEXSCREENER_MIN_INTERVAL_SECONDS
        value: "0.25"
