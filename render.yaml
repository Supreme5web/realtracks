services:
  - type: web
    name: pumpfun-alert-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Set this and the RPC/WS URLs auto-build against Helius. Leave unset
      # to fall back to the public (rate-limited) Solana RPC instead.
      - key: HELIUS_API_KEY
        sync: false
      # Optional - powers the extra alert fields (buys/sells, volume, age,
      # price, socials). Get a key at solanatracker.io. Leave unset and
      # alerts just fall back to the original name/CA/MC-only format.
      - key: SOLANA_TRACKER_API_KEY
        sync: false
      - key: MIN_MARKET_CAP_USD
        value: "12000"
      - key: POLL_INTERVAL_SECONDS
        value: "5"
      - key: MAX_TRACK_AGE_SECONDS
        value: "600"
      - key: RPC_MIN_INTERVAL_SECONDS
        value: "0.25"
      - key: DEXSCREENER_MIN_INTERVAL_SECONDS
        value: "0.25"
      # Optional - persists /stats (daily call count + hitrate) in Supabase
      # so it survives restarts/redeploys/idle spin-downs. Leave both unset
      # to keep /stats in-memory only (resets on every restart).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
