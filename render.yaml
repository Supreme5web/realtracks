services:
  - type: web
    name: pumpfun-alert-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Optional - if set, RPC/WS URLs auto-build against Ankr's mainnet
      # endpoint (requires a paid Ankr plan). Leave unset to use
      # PublicNode's free mainnet RPC instead (no key needed, default).
      - key: ANKR_API_KEY
        sync: false
      - key: MIN_MARKET_CAP_USD
        value: "12000"
      - key: POLL_INTERVAL_SECONDS
        value: "5"
      - key: MAX_TRACK_AGE_SECONDS
        value: "600"
      - key: RPC_MIN_INTERVAL_SECONDS
        value: "0.25"
      - key: DEXSCREENER_MIN_INTERVAL_SECONDS
        value: "0.25"
      # Optional - persists /stats (daily call count + hitrate) in Supabase
      # so it survives restarts/redeploys/idle spin-downs. Leave both unset
      # to keep /stats in-memory only (resets on every restart).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # Optional - lets you type /ask <question> (or just a plain-text
      # question) into the Telegram chat and get an answer grounded in
      # this bot's own call-history stats, via Gemini 3.5 Flash-Lite.
      # Get a free key at aistudio.google.com. Leave unset and /ask just
      # replies that it's not configured - everything else still works.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash-lite"
